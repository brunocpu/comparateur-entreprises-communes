version: 2

# Surveillance des dépendances npm et des versions d'actions GitHub.
# Périodicité mensuelle : les dépendances npm servent uniquement au build
# (resvg-js, wawoff2, @fontsource/*) et n'ont pas d'effet sur le site.
# Titres produits : « chore(deps-dev): … », « chore(deps): … », « chore(ci): … ».
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
