# Déploiement automatique sur GitHub Pages à chaque push sur `main`.
#
# Pré-requis côté GitHub :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions »
#
# L'app est statique pure : on déploie la racine du repo telle quelle.
# Aucun build, aucune dépendance.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute SW cache version (hash du SHELL)
        run: node scripts/compute-sw-version.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
