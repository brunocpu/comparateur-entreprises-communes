<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fond papier + filet inférieur subtil -->
  <rect width="1200" height="630" fill="#f5f1ea"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#d9d3c4" stroke-width="2"/>

  <!-- ===== Colonne gauche : titre éditorial ===== -->
  <!-- Eyebrow mono uppercase, lettrage espacé -->
  <text x="80" y="100" font-family="GeistMono" font-size="20" fill="#6e6962" letter-spacing="3.5">
    COMPARATEUR · DONNÉES INSEE · 2026
  </text>

  <!-- H1 deux lignes, Fraunces 48pt, seconde ligne en italique rouille -->
  <text x="80" y="220" font-family="Fraunces" font-weight="500" font-size="48" fill="#1c1a16" letter-spacing="-0.8">
    Comparateur de communes —
  </text>
  <text x="80" y="290" font-family="Fraunces" font-style="italic" font-weight="400" font-size="48" fill="#c2570e" letter-spacing="-0.8">
    démographie des entreprises
  </text>

  <!-- Filet horizontal entre titre et sous-titre, façon Datawrapper -->
  <line x1="80" y1="345" x2="200" y2="345" stroke="#1c1a16" stroke-width="2"/>

  <!-- Sous-titre Geist, trois lignes -->
  <text x="80" y="398" font-family="Geist" font-weight="400" font-size="22" fill="#6b6660">
    Positionner une commune française dans sa strate de
  </text>
  <text x="80" y="430" font-family="Geist" font-weight="400" font-size="22" fill="#6b6660">
    comparables sur les indicateurs Insee Side : entreprises
  </text>
  <text x="80" y="462" font-family="Geist" font-weight="400" font-size="22" fill="#6b6660">
    actives, créations, croissance, profil sectoriel A10.
  </text>

  <!-- ===== Colonne droite : encart « indicateur + bullet chart » =====
       Données réelles d'Arles (Bouches-du-Rhône, 13) — sélectionnée parce
       qu'elle compte 11 communes comparables dans son département (vue
       par défaut du sélecteur de zone). ===== -->
  <g transform="translate(770, 80)">
    <!-- Card surface beige clair, filet papier -->
    <rect x="0" y="0" width="360" height="470" fill="#fffefb" stroke="#d9d3c4" stroke-width="1" rx="6"/>

    <!-- Header card : commune cible -->
    <text x="24" y="44" font-family="GeistMono" font-size="11" fill="#6e6962" letter-spacing="2.2">
      CIBLE · BOUCHES-DU-RHÔNE
    </text>
    <text x="24" y="80" font-family="Fraunces" font-weight="500" font-size="28" fill="#1c1a16" letter-spacing="-0.6">
      Arles
    </text>
    <line x1="24" y1="100" x2="336" y2="100" stroke="#d9d3c4"/>

    <!-- Indicateur cardinal -->
    <text x="24" y="130" font-family="GeistMono" font-size="11" fill="#6e6962" letter-spacing="2.2">
      ENTREPRISES ACTIVES
    </text>
    <text x="24" y="180" font-family="Fraunces" font-weight="400" font-size="56" fill="#1c1a16" letter-spacing="-1.4">
      5 069
    </text>

    <!-- Bullet chart : Q1—Q3 ribbon + médiane + cible.
         Domaine [3349 ; 5253] (12 % de padding autour des extrêmes).
         Q1=3533 → 9,7 % → x=30
         Médiane=4038 → 36,2 % → x=113
         Q3=4227 → 46,1 % → x=144
         Cible=5069 → 90,3 % → x=282 (au-dessus du quart supérieur) -->
    <g transform="translate(24, 210)">
      <line x1="0" y1="14" x2="312" y2="14" stroke="#d9d3c4" stroke-width="1"/>
      <rect x="30" y="6" width="114" height="16" fill="#ebe6da"/>
      <line x1="113" y1="2" x2="113" y2="26" stroke="#6e6962" stroke-width="1.5"/>
      <circle cx="282" cy="14" r="9" fill="#1c3d5a" stroke="#fffefb" stroke-width="3"/>
    </g>
    <text x="24" y="262" font-family="GeistMono" font-size="11" fill="#6e6962" letter-spacing="0.5">
      Q1 3 533 · médiane 4 038 · Q3 4 227
    </text>

    <line x1="24" y1="284" x2="336" y2="284" stroke="#d9d3c4"/>

    <!-- Profil sectoriel : 3 secteurs dominants d'Arles, scale max 60 % -->
    <text x="24" y="312" font-family="GeistMono" font-size="11" fill="#6e6962" letter-spacing="2.2">
      RÉPARTITION SECTORIELLE
    </text>

    <!-- Commerce, transports : 27,4 % | médiane 25,9 % -->
    <text x="24" y="342" font-family="Geist" font-size="14" fill="#1c1a16">Commerce, transports</text>
    <text x="336" y="342" font-family="GeistMono" font-size="12" fill="#6e6962" text-anchor="end">27,4 %</text>
    <rect x="24" y="350" width="312" height="6" fill="#ebe6da"/>
    <rect x="24" y="350" width="142" height="6" fill="#1c3d5a"/>
    <line x1="158" y1="346" x2="158" y2="360" stroke="#c2570e" stroke-width="2"/>
    <circle cx="158" cy="346" r="4" fill="#c2570e"/>

    <!-- Services scientifiques : 17,0 % | médiane 17,3 % -->
    <text x="24" y="385" font-family="Geist" font-size="14" fill="#1c1a16">Services scientifiques</text>
    <text x="336" y="385" font-family="GeistMono" font-size="12" fill="#6e6962" text-anchor="end">17,0 %</text>
    <rect x="24" y="393" width="312" height="6" fill="#ebe6da"/>
    <rect x="24" y="393" width="88" height="6" fill="#1c3d5a"/>
    <line x1="90" y1="389" x2="90" y2="403" stroke="#c2570e" stroke-width="2"/>
    <circle cx="90" cy="389" r="4" fill="#c2570e"/>

    <!-- Administration, santé, éducation : 14,0 % | médiane 20,2 % -->
    <text x="24" y="428" font-family="Geist" font-size="14" fill="#1c1a16">Administration, santé</text>
    <text x="336" y="428" font-family="GeistMono" font-size="12" fill="#6e6962" text-anchor="end">14,0 %</text>
    <rect x="24" y="436" width="312" height="6" fill="#ebe6da"/>
    <rect x="24" y="436" width="73" height="6" fill="#1c3d5a"/>
    <line x1="105" y1="432" x2="105" y2="446" stroke="#c2570e" stroke-width="2"/>
    <circle cx="105" cy="432" r="4" fill="#c2570e"/>
  </g>
</svg>